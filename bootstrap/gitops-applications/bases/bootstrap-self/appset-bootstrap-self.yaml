apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap-self
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: &repo git@github.com:ayjM6/cluster-config.git
        revision: &rev HEAD
        # Kept in step with the cluster-config ApplicationSet - see the note
        # there on the repo-server startup race.
        requeueAfterSeconds: 30
        directories:
          - path: bootstrap/*/overlays/all
          - path: bootstrap/*/overlays # cluster-type
          - path: bootstrap/*/overlays # cluster-env
          - path: bootstrap/*/overlays # cluster-name
        values:
          app: '{{ index .path.segments 1 }}'
  template:
    metadata:
      name: 'bootstrap-self-{{ .values.app }}'
      labels:
        type: bootstrap
    spec:
      project: default
      source:
        repoURL: *repo
        targetRevision: *rev
        path: '{{ .path.path }}'
      destination:
        name: in-cluster
      syncPolicy:
        automated:
          enabled: true
          selfHeal: true
          prune: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - SkipDryRunOnMissingResource=true
