apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-config
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: &repo git@github.com:ayjM6/cluster-config.git
        revision: &rev HEAD
        # On a freshly bootstrapped cluster the applicationset-controller can
        # dial repo-server before it is listening, leaving the generator in
        # "connection refused" until the next requeue. The default (180s) makes
        # that a ~3 minute silent stall during spoke bootstrap; 30s keeps it
        # short. See docs/demo.md step 6.
        requeueAfterSeconds: 30
        directories:
          - path: apps/*/*/overlays/all
          - path: apps/*/*/overlays # cluster-type
          - path: apps/*/*/overlays # cluster-env
          - path: apps/*/*/overlays # cluster-name
        values:
          type: '{{ index .path.segments 1 }}'
          app: '{{ index .path.segments 2 }}'
  template:
    metadata:
      name: '{{ .values.app }}'
      labels:
        type: '{{ .values.type }}'
    spec:
      project: default
      source:
        repoURL: *repo
        targetRevision: *rev
        path: '{{ .path.path }}'
      destination:
        name: in-cluster
      syncPolicy:
        automated:
          enabled: true
          selfHeal: true
          prune: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - SkipDryRunOnMissingResource=true
