apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-config
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  # requires progressive syncs to be enabled on the applicationset controller
  # (bootstrap/openshift-gitops/components/progressive-syncs). RollingSync
  # forces autosync off on generated Applications and triggers the syncs itself,
  # step by step, waiting for each step to be Healthy before starting the next.
  # Applications not matched by any step are never synced, so keep the first
  # step a catch-all.
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: app
              operator: NotIn
              values:
                - bookinfo
        # bookinfo needs the mesh control plane up first, or its pods start
        # without their envoy sidecar
        - matchExpressions:
            - key: app
              operator: In
              values:
                - bookinfo
  generators:
    - git:
        repoURL: &repo git@github.com:ayjM6/cluster-config.git
        revision: &rev HEAD
        directories:
          - path: apps/*/*/overlays/all
          - path: apps/*/*/overlays # cluster-type
          - path: apps/*/*/overlays # cluster-env
          - path: apps/*/*/overlays # cluster-name
        values:
          type: '{{ index .path.segments 1 }}'
          app: '{{ index .path.segments 2 }}'
  template:
    metadata:
      name: '{{ .values.app }}'
      labels:
        type: '{{ .values.type }}'
        app: '{{ .values.app }}'
    spec:
      project: default
      source:
        repoURL: *repo
        targetRevision: *rev
        path: '{{ .path.path }}'
      destination:
        name: in-cluster
      syncPolicy:
        # RollingSync disables automated sync and triggers the syncs itself, so
        # selfHeal would be ignored. automated.enabled must stay true though:
        # prune is only read from here while automated sync is enabled.
        automated:
          enabled: true
          prune: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - SkipDryRunOnMissingResource=true
