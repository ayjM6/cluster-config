apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
spec:
  rbac:
    policy: |
      # explicit username match: dex's openshift connector only forwards real
      # Group membership, not the system:cluster-admins virtual group, so a
      # ClusterRoleBinding straight to a User doesn't satisfy the rules below
      g, admin, role:admin
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
    # ArgoCD RBAC only matches policy subjects against the "sub" claim and
    # whatever claim names are listed here. dex's "sub" for OpenShift OAuth
    # logins is an opaque connector-generated ID, never the username, so
    # preferred_username must be pulled in explicitly for the "g, admin, ..."
    # rule above to ever match.
    scopes: '[groups, preferred_username]'
