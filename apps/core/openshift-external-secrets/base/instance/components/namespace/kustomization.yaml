apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
namespace: external-secrets
resources:
  - namespace.yaml
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: Certificate
        fieldPaths:
          - spec.dnsNames.0
          - spec.dnsNames.1
        options:
          delimiter: .
          index: 1
