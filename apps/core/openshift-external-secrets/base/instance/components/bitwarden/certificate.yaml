apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-tls-certs
spec:
  dnsNames:
    - bitwarden-sdk-server.<namespace>.svc.cluster.local
    - external-secrets-bitwarden-sdk-server.<namespace>.svc.cluster.local
    - localhost
  duration: 8760h0m0s
  ipAddresses:
    - 127.0.0.1
    - ::1
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: self-signed
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  renewBefore: 30m0s
  secretName: bitwarden-tls-certs
