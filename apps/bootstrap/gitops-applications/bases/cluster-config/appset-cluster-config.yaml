apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-config
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: &repo git@github.com:ayjM6/cluster-config.git
        revision: &rev HEAD
        directories:
          - path: apps/*/*/overlays/all
          - path: apps/*/*/overlays # cluster-type
          - path: apps/*/*/overlays # cluster-env
          - path: apps/*/*/overlays # cluster-name
          - path: apps/bootstrap/*/overlays/*
            exclude: true
        values:
          type: '{{ index .path.segments 1 }}'
          app: '{{ index .path.segments 2 }}'
  template:
    metadata:
      name: '{{ .values.app }}'
      labels:
        type: '{{ .values.type }}'
    spec:
      project: default
      source:
        repoURL: *repo
        targetRevision: *rev
        path: '{{ .path.path }}'
      destination:
        name: in-cluster
      syncPolicy:
        automated:
          enabled: true
          selfHeal: true
          prune: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - SkipDryRunOnMissingResource=true
