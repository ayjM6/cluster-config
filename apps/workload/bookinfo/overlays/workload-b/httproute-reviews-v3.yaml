# Mesh route (GAMMA: parentRefs kind Service, not Gateway) pinning
# productpage's internal calls to the reviews Service onto the v3 backend
# (red stars) - see base/kustomization.yaml for the per-version Services
# this references.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reviews
  namespace: bookinfo
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: reviews
      port: 9080
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: reviews-v3
          port: 9080
