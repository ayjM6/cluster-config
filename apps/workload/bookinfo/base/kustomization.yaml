apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookinfo
resources:
  - namespace.yaml
  - route.yaml
  - https://raw.githubusercontent.com/openshift-service-mesh/istio/release-1.24/samples/bookinfo/platform/kube/bookinfo.yaml
  # Gateway API resources - Istio auto-provisions the Deployment/Service for
  # these (see route.yaml). The classic networking.istio.io Gateway sample
  # is intentionally omitted: it expects a hand-deployed "istio: ingressgateway"
  # workload that OSSM3's Gateway API approach doesn't create.
  - https://raw.githubusercontent.com/openshift-service-mesh/istio/release-1.24/samples/bookinfo/gateway-api/bookinfo-gateway.yaml
