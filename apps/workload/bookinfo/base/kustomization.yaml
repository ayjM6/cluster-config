apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookinfo
resources:
  - namespace.yaml
  - route.yaml
  - https://raw.githubusercontent.com/openshift-service-mesh/istio/release-1.30/samples/bookinfo/platform/kube/bookinfo.yaml
  # Gateway API resources - Istio auto-provisions the Deployment/Service for
  # these (see route.yaml). The classic networking.istio.io Gateway sample
  # is intentionally omitted: it expects a hand-deployed "istio: ingressgateway"
  # workload that OSSM3's Gateway API approach doesn't create.
  - https://raw.githubusercontent.com/openshift-service-mesh/istio/release-1.30/samples/bookinfo/gateway-api/bookinfo-gateway.yaml
  # Per-version Services (reviews-v1/v2/v3, etc.) that overlays route to via
  # a per-cluster mesh HTTPRoute (GAMMA: parentRef kind Service) - see
  # overlays/workload-*.
  - https://raw.githubusercontent.com/openshift-service-mesh/istio/release-1.30/samples/bookinfo/platform/kube/bookinfo-versions.yaml
patches:
  # The Route (route.yaml) fronts the gateway Service, so it doesn't need
  # its own cloud LoadBalancer - keep the auto-provisioned Service ClusterIP.
  - target:
      kind: Gateway
      name: bookinfo-gateway
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          networking.istio.io/service-type: ClusterIP
