apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: workload-qa-b
  labels:
    type: workload
    name: workload-qa-b
    cluster.open-cluster-management.io/clusterset: workload
spec:
  hubAcceptsClient: true
---
apiVersion: agent.open-cluster-management.io/v1
kind: KlusterletAddonConfig
metadata:
  name: workload-qa-b
  namespace: workload-qa-b
spec:
  applicationManager:
    enabled: true
  certPolicyController:
    enabled: true
  iamPolicyController:
    enabled: true
  policyController:
    enabled: true
  searchCollector:
    enabled: true
