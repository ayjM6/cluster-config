apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: vault-secret
  namespace: open-cluster-management-policies
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: bitwarden-token
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: external-secrets
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: bitwarden-token
                  namespace: external-secrets
                type: Opaque
                data:
                  token: '{{hub fromSecret "open-cluster-management-policies" "bitwarden-token" "token" hub}}'
