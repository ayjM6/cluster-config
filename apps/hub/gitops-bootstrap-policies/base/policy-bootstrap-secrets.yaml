# Copies the git-creds Secret from the hub (seeded by
# scripts/bootstrap-git-secret.sh) onto every matched managed cluster via
# RHACM hub templating. The credential value itself never appears in Git -
# only the `{{hub fromSecret ... hub}}` reference does.
#
# fromSecret can only read a Secret from the SAME namespace as this Policy
# (open-cluster-management-policies, set via this app's kustomization.yaml)
# - that's a hard RHACM access-control restriction, not a choice. That's
# why the source Secret lives there rather than in openshift-gitops.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: bootstrap-secrets
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: bootstrap-git-creds
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: openshift-gitops
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: git-creds
                  namespace: openshift-gitops
                  labels:
                    argocd.argoproj.io/secret-type: repository
                type: Opaque
                stringData:
                  url: '{{hub fromSecret "open-cluster-management-policies" "git-creds" "url" hub}}'
                  sshPrivateKey: '{{hub fromSecret "open-cluster-management-policies" "git-creds" "sshPrivateKey" hub}}'
