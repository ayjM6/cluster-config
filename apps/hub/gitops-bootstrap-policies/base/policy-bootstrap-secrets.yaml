apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: bootstrap-secrets
  namespace: open-cluster-management-policies
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: git-creds
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: openshift-gitops
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: git-creds
                  namespace: openshift-gitops
                  labels:
                    argocd.argoproj.io/secret-type: repository
                type: Opaque
                data:
                  url: '{{hub fromSecret "open-cluster-management-policies" "git-creds" "url" hub}}'
                  sshPrivateKey: '{{hub fromSecret "open-cluster-management-policies" "git-creds" "sshPrivateKey" hub}}'
